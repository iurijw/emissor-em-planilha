<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Emissor em Planilha">
  <title>Emissor em Planilha</title>
  <!-- Folha da nota (azul) com canto dobrado (preto) e grade de planilha vazada. Cores da marca: #0098D7 / #020202. -->
  <defs>
    <mask id="grade">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="12" y="26" width="10" height="8" rx="1" fill="#000"/>
      <rect x="26" y="26" width="26" height="8" rx="1" fill="#000"/>
      <rect x="12" y="38" width="10" height="8" rx="1" fill="#000"/>
      <rect x="26" y="38" width="26" height="8" rx="1" fill="#000"/>
      <rect x="12" y="50" width="10" height="8" rx="1" fill="#000"/>
      <rect x="26" y="50" width="26" height="8" rx="1" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#grade)">
    <polygon points="7,2 41,2 57,18 57,62 7,62" fill="#0098D7"/>
    <polygon points="41,2 41,18 57,18" fill="#020202"/>
  </g>
</svg>
