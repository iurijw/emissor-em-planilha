<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Emissor em Planilha">
  <title>Emissor em Planilha</title>
  <!-- Três folhas em lote (tons do azul #0098D7), grade de planilha vazada e canto dobrado preto (#020202). -->
  <!-- Canto dobrado claro quando o sistema está no escuro (aba do navegador, painel). -->
  <style>@media (prefers-color-scheme: dark) { .canto { fill: #e3ebef; } }</style>
  <defs>
    <mask id="grade">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="60" y="72" width="14" height="10" rx="2.5" fill="#000"/>
      <rect x="78" y="72" width="22" height="10" rx="2.5" fill="#000"/>
      <rect x="60" y="86" width="14" height="10" rx="2.5" fill="#000"/>
      <rect x="78" y="86" width="22" height="10" rx="2.5" fill="#000"/>
      <rect x="60" y="100" width="14" height="10" rx="2.5" fill="#000"/>
      <rect x="78" y="100" width="22" height="10" rx="2.5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#grade)">
    <path d="M26 6H60L78 24V76Q78 84 70 84H26Q18 84 18 76V14Q18 6 26 6Z" fill="#B3E0F3"/>
    <path d="M42 22H76L94 40V92Q94 100 86 100H42Q34 100 34 92V30Q34 22 42 22Z" fill="#66C1E7"/>
    <path d="M58 38H92L110 56V108Q110 116 102 116H58Q50 116 50 108V46Q50 38 58 38Z" fill="#0098D7"/>
  </g>
  <path class="canto" d="M92 38L110 56H96Q92 56 92 52Z" fill="#020202"/>
</svg>
