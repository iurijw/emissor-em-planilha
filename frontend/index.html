<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- O tamanho de texto do sistema (celular) vale aqui: as fontes estão em rem. -->
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#f9fdfe" />
    <!-- Claro e escuro, seguindo o sistema; a escolha de "Minha conta → Aparência" vem do localStorage antes de desenhar. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("esquema-de-cor") || "light dark"; } catch (e) {}
    </script>
    <title>Emissor em Planilha</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Obrigatório para a Glide Data Grid: editores de célula abrem neste portal -->
    <div id="portal" style="position: fixed; left: 0; top: 0; z-index: 9999"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
