[project]
name = "emissor"
version = "0.1.0"
description = "Emissor em Planilha: emissão de NFS-e Nacional (Sefin) em lote a partir de uma planilha"
authors = [
    { name = "dev", email = "dev@local" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "signxml>=5.1.0",
    "sqlmodel>=0.0.47",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
emissor = "emissor:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # mensagens ao usuário em português são longas; o formatter cuida do código

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]
