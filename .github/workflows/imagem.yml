# Publica a imagem Docker do Emissor em Planilha no GitHub Container Registry.
# Usada pela hospedagem (uma instância por cliente) e por quem preferir baixar a imagem pronta:
#   docker pull ghcr.io/iurijw/emissor-em-planilha:latest
# PRs geram a imagem :pr-N e movem a :dev, que a instância de testes da hospedagem (canal dev) segue para conferir
# a mudança antes da release; cada release também move a :dev. A :latest continua saindo só da main.
name: Imagem Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    # PR de fork não publica (o token não escreve no ghcr.io e o código não foi revisado).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main -> latest e sha-<commit>; tag v1.2.3 -> 1.2.3, 1.2 e dev; PR n -> pr-n e dev
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=raw,value=dev,enable=${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
